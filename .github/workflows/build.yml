name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to publish Releases from the default branch

env:
  NCNN_VERSION: "20260526"
  TORCH_VERSION: "2.9.1"

jobs:
  tests:
    name: Tests (GIF codec + native upscaler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GIF encoder/decoder unit tests
        run: ./gradlew --no-daemon :gifcodec:test

      - name: Install model conversion tools
        run: |
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements-convert.txt

      - name: Cache host NCNN build
        uses: actions/cache@v4
        with:
          path: build/native-tests/ncnn-install
          key: ncnn-host-${{ env.NCNN_VERSION }}-${{ runner.os }}

      - name: Native upscaler tests
        run: scripts/run_native_tests.sh

  build:
    name: Build APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache NCNN for Android
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/ncnn-android-vulkan
          key: ncnn-android-${{ env.NCNN_VERSION }}

      - name: Cache models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: models-${{ hashFiles('scripts/fetch_models.sh', 'scripts/convert_to_ncnn.py', 'scripts/requirements-convert.txt') }}

      - name: Install model conversion tools
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: |
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements-convert.txt

      - name: Download NCNN and models
        run: |
          scripts/fetch_ncnn.sh
          scripts/fetch_models.sh

      - name: Set up signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.UPSCALER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upscaler.jks"
            echo "UPSCALER_KEYSTORE_FILE=$RUNNER_TEMP/upscaler.jks" >> "$GITHUB_ENV"
            echo "Using the permanent signing key from GitHub Secrets."
          else
            echo "::warning::No UPSCALER_KEYSTORE_BASE64 secret: signing with a throwaway debug key. Updates will need an uninstall first. See README."
          fi

      - name: Build release APK
        env:
          UPSCALER_KEYSTORE_PASSWORD: ${{ secrets.UPSCALER_KEYSTORE_PASSWORD }}
          UPSCALER_KEY_ALIAS: ${{ secrets.UPSCALER_KEY_ALIAS }}
          UPSCALER_KEY_PASSWORD: ${{ secrets.UPSCALER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Upscaler-v1.0.${GITHUB_RUN_NUMBER}.apk"
          ls -la dist
          unzip -l dist/*.apk | grep -E 'models/|libupscaler' || true

      - uses: actions/upload-artifact@v4
        with:
          name: Upscaler-v1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publish GitHub Release (default branch only)
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Upscaler v1.0.${{ github.run_number }}
          files: dist/*.apk
          body: |
            Download the APK below on your phone and open it to install.
            Built from ${{ github.sha }}.
